<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6 sm:p-8">

    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 sm:p-10 text-center flex flex-col items-center">
        
        <!-- 1. 프로필 사진 -->
        <div class="relative mb-6">
            <img 
                src="나의포터.png" 
                alt="프로필 사진" 
                class="w-32 h-32 sm:w-36 sm:h-36 rounded-full object-cover ring-4 ring-indigo-50 shadow-md"
                onerror="this.onerror=null; this.src='https://placehold.co/150x150/e2e8f0/475569?text=Profile';"
            />
        </div>

        <!-- 2. 이름 -->
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            정순영
        </h1>

        <!-- 3. 한 줄 소개 -->
        <p class="text-sm sm:text-base font-semibold text-indigo-600 mb-6 tracking-wide">
            33년 공직생활
        </p>

        <!-- 4. 3~4줄 짧은 자기소개 -->
        <p class="text-sm sm:text-base text-slate-600 leading-relaxed max-w-xs sm:max-w-sm font-normal">
            식품안전 및 공중위생
        </p>

    </main>

</body>
</html>
